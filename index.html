<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vape Shop</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: rgba(30, 30, 35, 0.85);
      --accent: #ff6b2b;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding-bottom: 85px;
    }

    /* Анимированный фон */
    .animated-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #1a1a22 0%, #0d0d10 100%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      animation: float 14s infinite ease-in-out alternate;
    }

    .orb-1 {
      width: 300px;
      height: 300px;
      background: #ff6b2b;
      top: -40px;
      left: -60px;
    }

    .orb-2 {
      width: 350px;
      height: 350px;
      background: #6c2bd9;
      bottom: -60px;
      right: -60px;
      animation-delay: -5s;
    }

    .orb-3 {
      width: 240px;
      height: 240px;
      background: #0ea5e9;
      top: 40%;
      left: 35%;
      animation-delay: -9s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, 50px) scale(1.15); }
      100% { transform: translate(-25px, 20px) scale(0.95); }
    }

    /* Адаптивный контейнер: на телефоне во всю ширину, на ПК по центру до 1040px */
    .app-wrapper {
      max-width: 1040px;
      margin: 0 auto;
      position: relative;
    }

    header {
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(14px);
      background: rgba(18, 18, 20, 0.85);
      border-bottom: 1px solid var(--border);
    }

    .top-bar {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .catalog-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .drawer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 15, 18, 0.96);
      backdrop-filter: blur(16px);
      z-index: 50;
      padding: 20px;
      overflow-y: auto;
    }

    .drawer.active {
      display: flex;
      flex-direction: column;
    }

    .drawer-inner {
      max-width: 540px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }

    .category-item {
      padding: 14px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      cursor: pointer;
    }

    .category-item:hover {
      color: var(--accent);
    }

    .container {
      padding: 16px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    /* Сетка: 2 колонки на телефоне, 3-4 на планшете и ПК */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
    }

    @media (min-width: 900px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(10px);
    }

    .img-placeholder {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.08));
      border: 1px dashed rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      padding: 8px;
      margin-bottom: 10px;
    }

    .product-title {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price {
      font-size: 16px;
      font-weight: 700;
    }

    .add-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 4px 8px;
    }

    .qty-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 20px;
    }

    .qty-val {
      font-size: 14px;
      font-weight: 600;
    }

    /* Плавающая кнопка корзины в правом нижнем углу */
    .cart-fab {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 13px 18px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 14px;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(255, 107, 43, 0.45);
      cursor: pointer;
      z-index: 30;
      transition: transform 0.15s ease;
    }

    .cart-fab:active {
      transform: scale(0.95);
    }

    .cart-fab.visible {
      display: flex;
    }

    .cart-badge {
      background: #fff;
      color: var(--accent);
      font-weight: 800;
      font-size: 12px;
      padding: 2px 7px;
      border-radius: 20px;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-title {
      font-size: 14px;
      margin-bottom: 4px;
    }

    .cart-item-price {
      font-size: 13px;
      color: var(--text-muted);
    }

    .cart-footer {
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .checkout-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .clear-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: none;
      border-radius: 12px;
      padding: 10px;
      font-size: 14px;
      margin-top: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="animated-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <header>
    <div class="top-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="Поиск по наличию..." oninput="renderProducts()" />
      <button class="catalog-btn" onclick="toggleCatalog()">Каталог ☰</button>
    </div>
  </header>

  <div class="app-wrapper">
    <main class="container">
      <div class="section-title" id="currentCategoryTitle">Все товары</div>
      <div class="grid" id="productsGrid"></div>
    </main>
  </div>

  <!-- Выдвижной каталог -->
  <div class="drawer" id="catalogDrawer">
    <div class="drawer-inner">
      <div class="drawer-header">
        <h3>Каталог</h3>
        <button class="close-btn" onclick="toggleCatalog()">✕</button>
      </div>
      <div id="categoryList"></div>
    </div>
  </div>

  <!-- Выдвижная корзина -->
  <div class="drawer" id="cartDrawer">
    <div class="drawer-inner">
      <div class="drawer-header">
        <h3>Корзина</h3>
        <button class="close-btn" onclick="toggleCart()">✕</button>
      </div>
      <div class="cart-items" id="cartItemsList"></div>
      <div class="cart-footer">
        <div class="cart-total">
          <span>Итого:</span>
          <span id="cartTotalSum">0₽</span>
        </div>
        <button class="checkout-btn" onclick="checkout()">Оформить заказ</button>
        <button class="clear-btn" onclick="clearCart()">Очистить корзину</button>
      </div>
    </div>
